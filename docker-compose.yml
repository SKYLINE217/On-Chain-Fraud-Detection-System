
networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge

services:

  redis:
    image: redis:7-alpine
    networks:
      - backend
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.api
    networks:
      - backend
      - frontend
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set in .env}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@redis:6379
      MODEL_CHECKPOINT: /app/checkpoints/best_model.pt
      MODEL_CONFIG: /app/checkpoints/model_config.json
      API_KEY: ${API_KEY:?API_KEY must be set in .env}
      ENV: ${ENV:-production}
    volumes:
      - ./checkpoints:/app/checkpoints:ro
      - ./data/processed:/app/data/processed:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s  # Allow time for model loading
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000

  dashboard:
    build:
      context: ./frontend/client
      dockerfile: Dockerfile
    networks:
      - frontend
    ports:
      - "3000:8080"

  batch-job:
    build:
      context: .
      dockerfile: Dockerfile.api
    networks:
      - backend
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set in .env}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@redis:6379
      MODEL_CHECKPOINT: /app/checkpoints/best_model.pt
      MODEL_CONFIG: /app/checkpoints/model_config.json
    volumes:
      - ./checkpoints:/app/checkpoints:ro
      - ./data/processed:/app/data/processed:ro
    command: python -m src.serving.score_batch --flush-redis
    profiles:
      - batch   # run manually: docker-compose --profile batch up batch-job

volumes:
  redis_data:

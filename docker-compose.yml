# docker-compose.yml
# onchain-fraud-gnn — Full service map
# Reference: system_design.md §4
#
# Stage 1: only neo4j + redis needed
# Stage 3+: fastapi, bff, batch-job wired in
#
# Compliance Disclaimer: This system is a research and portfolio
# demonstration only. Not a certified AML/CFT compliance tool.

version: "3.9"

services:
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/changeme_in_prod
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt protocol
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme_in_prod}
      REDIS_URL: redis://redis:6379
      MODEL_CHECKPOINT: /app/checkpoints/best_model.pt
      MODEL_CONFIG: /app/checkpoints/model_config.json
      API_KEY: ${API_KEY:-dev_key_change_me}
    volumes:
      - ./checkpoints:/app/checkpoints:ro
      - ./data/processed:/app/data/processed:ro
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000

  bff:
    build:
      context: ./frontend
      dockerfile: Dockerfile.bff
    ports:
      - "3000:3000"
    depends_on:
      fastapi:
        condition: service_started
    environment:
      FASTAPI_URL: http://fastapi:8000
      FASTAPI_API_KEY: ${API_KEY:-dev_key_change_me}
      JWT_SECRET: ${JWT_SECRET:-changeme_in_prod_use_256bit}
      JWT_EXPIRES_IN: 8h
      NODE_ENV: production
      PORT: 3000
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX: 100
      ADMIN_RATE_LIMIT_MAX: 20
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: node server/src/index.js

  batch-job:
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: changeme_in_prod
      REDIS_URL: redis://redis:6379
      MODEL_CHECKPOINT: /app/checkpoints/best_model.pt
      MODEL_CONFIG: /app/checkpoints/model_config.json
    volumes:
      - ./checkpoints:/app/checkpoints:ro
      - ./data/processed:/app/data/processed:ro
    command: python -m src.serving.score_batch --flush-redis
    profiles:
      - batch   # run manually: docker-compose --profile batch up batch-job

volumes:
  neo4j_data:
  neo4j_logs:
  redis_data:

version: '3.8'

# BUG-31 Fix: Added healthchecks for neo4j and redis services.
# The API now only starts after neo4j is healthy (prevents startup race conditions).

services:
  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
    volumes:
      - neo4j_data:/data
    # BUG-31: Health check using cypher-shell
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 45s

  cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    # BUG-31: Health check using redis-cli ping
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  api:
    build: ../backend
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - REDIS_HOST=cache
      - REDIS_PORT=6379
      # BUG-01: Set ALLOWED_ORIGINS to restrict CORS in production
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000
    # BUG-31: API waits for neo4j and redis to be healthy before starting
    depends_on:
      neo4j:
        condition: service_healthy
      cache:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ../frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  neo4j_data:

program: src/models/sweep_runner.py
method: bayes
metric:
  name: val_pr_auc
  goal: maximize

parameters:
  hidden_channels:
    values: [64, 128, 256]
  num_layers:
    values: [2, 3]
  dropout:
    values: [0.2, 0.3, 0.4, 0.5]
  lr:
    values: [0.0001, 0.001, 0.01]
  weight_decay:
    values: [0.0001, 0.0005, 0.001]
  aggr:
    values: ["mean", "max"]
  model_type:
    values: ["graphsage", "gat"]

early_terminate:
  type: hyperband
  min_iter: 20
  eta: 3
